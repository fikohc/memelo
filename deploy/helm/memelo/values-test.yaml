s3:
  mediaBucket: melo-test-media
  tempBucket: melo-test-temp

elastic:
  metadataIndex: melo-test-media-metadata
  tagIndex: melo-test-tag-metadata


postgres:
  authDb: "melo-test-auth"
  telegramDb: "melo-test-telegram"

ingress:
  webappDomain: "webapp.test.cluster.memelo.cloud"   # e.g. test.example.com
  webhookDomain: "tg-webhook.test.cluster.memelo.cloud"  # e.g. hooks-test.example.com

telegram:
  # Telegram fetches photos by URL only up to 5 MB, so upload anything bigger.
  largeMediaThresholdMb: 5
