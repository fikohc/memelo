{{- if and .Values.ingress.enabled .Values.ingress.webappDomain .Values.secrets.htpasswdEntry }}
# htpasswd file for ingress-nginx basic auth on the webapp ingress.
# ingress-nginx reads the htpasswd content from the `auth` key.
apiVersion: v1
kind: Secret
metadata:
  name: memelo-webapp-basic-auth
  labels:
    {{- include "memelo.labels" . | nindent 4 }}
type: Opaque
stringData:
  auth: {{ .Values.secrets.htpasswdEntry | quote }}
{{- end }}
