name: CD Helm

on:
  workflow_dispatch:
    inputs:
      TAG:
        type: string
        description: tag-to-deploy

concurrency:
  group: cd-helm
  cancel-in-progress: false

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          if [[ "${{ github.event.inputs.TAG }}" == *-dev ]]; then
            echo 'matrix=["test"]' >> $GITHUB_OUTPUT
          else
            echo 'matrix=["test", "production"]' >> $GITHUB_OUTPUT
          fi

  deploy:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_env: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
      max-parallel: 1
    environment: memelo-${{ matrix.target_env }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install sops
        env:
          SOPS_VERSION: v3.10.2
        run: |
          curl -fsSLo sops "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          sudo install -m 0755 sops /usr/local/bin/sops
          rm sops
          sops --version

      - name: Import SOPS PGP key
        run: echo "${{ secrets.SOPS_PGP_PRIVATE_KEY }}" | gpg --batch --import

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Deploy via Helm
        run: |
          secrets_file="$RUNNER_TEMP/secrets.yaml"
          trap 'rm -f "$secrets_file"' EXIT
          sops -d deploy/helm/memelo/secrets/${{ matrix.target_env }}.enc.yaml > "$secrets_file"
          helm upgrade --install memelo deploy/helm/memelo \
            --namespace memelo-${{ matrix.target_env }} --create-namespace \
            -f deploy/helm/memelo/values.yaml \
            -f deploy/helm/memelo/values-${{ matrix.target_env }}.yaml \
            -f "$secrets_file" \
            --set image.tag=${{ github.event.inputs.TAG }} \
            --wait --timeout 5m

      - name: Port-forward storage-service
        if: ${{ matrix.target_env == 'production' }}
        run: |
          kubectl port-forward -n memelo-${{ matrix.target_env }} svc/storage-service 7001:7001 \
            > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:7001/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/port-forward.log"
          exit 1

      - name: Tests
        uses: robherley/go-test-action@v0
        with:
          moduleDirectory: tests/e2e
        env:
          STORAGE_SERVICE_URI: http://localhost:7001
        if: ${{ matrix.target_env == 'production' }}
